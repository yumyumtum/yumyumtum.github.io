<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask Me - TommyYanPS</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .chat-container {
            max-width: 800px;
            margin: 40px auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .chat-header h1 {
            margin: 0;
            font-size: 24px;
        }
        
        .chat-header p {
            margin: 5px 0 0;
            opacity: 0.9;
            font-size: 14px;
        }
        
        .chat-messages {
            height: 500px;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }
        
        .message {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
            animation: fadeIn 0.3s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.user {
            flex-direction: row-reverse;
        }
        
        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
        }
        
        .message.bot .message-content {
            background: white;
            color: #333;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        
        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin: 0 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }
        
        .message.bot .message-avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .message.user .message-avatar {
            background: #e9ecef;
        }
        
        .chat-input-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #e9ecef;
            display: flex;
            gap: 10px;
        }
        
        #chatInput {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            border-radius: 25px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }
        
        #chatInput:focus {
            border-color: #667eea;
        }
        
        #sendButton {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        #sendButton:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        #sendButton:active {
            transform: translateY(0);
        }
        
        #sendButton:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 10px;
        }
        
        .typing-indicator span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #667eea;
            animation: typing 1.4s infinite;
        }
        
        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }
        
        .back-button {
            display: inline-block;
            margin: 20px;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 20px;
            transition: transform 0.2s;
        }
        
        .back-button:hover {
            transform: translateY(-2px);
        }
        
        .suggestions {
            display: flex;
            gap: 10px;
            padding: 10px 20px;
            overflow-x: auto;
            background: white;
        }
        
        .suggestion-chip {
            padding: 8px 16px;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .suggestion-chip:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-button">← Back to Home</a>
    
    <div class="chat-container">
        <div class="chat-header">
            <h1>🤖 Ask Me Anything</h1>
            <p>Chat with my AI assistant</p>
        </div>
        
        <div class="suggestions">
            <div class="suggestion-chip" onclick="sendSuggestion('Tell me about Tommy')">Tell me about Tommy</div>
            <div class="suggestion-chip" onclick="sendSuggestion('What are his interests?')">What are his interests?</div>
            <div class="suggestion-chip" onclick="sendSuggestion('Show me his projects')">Show me his projects</div>
            <div class="suggestion-chip" onclick="sendSuggestion('What music does he like?')">What music does he like?</div>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">
                <div class="message-avatar">🤖</div>
                <div class="message-content">
                    Hi! I'm Tommy's AI assistant. Ask me anything about him, his projects, or just chat! 😊
                </div>
            </div>
        </div>
        
        <div class="chat-input-container">
            <input type="text" id="chatInput" placeholder="Type your message..." autocomplete="off">
            <button id="sendButton" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendButton = document.getElementById('sendButton');
        
        // Pre-programmed responses (demo mode)
        const responses = {
            'tommy': "Tommy Yan is a high school student passionate about technology, coding, and quantitative finance. He's built some really cool trading analysis tools and loves basketball too! 🏀",
            'about': "Tommy is a creative and technical person who loves building things. He's into AI, machine learning, web development, and has a particular interest in quantitative trading. He's also a huge Steph Curry fan! 🏀",
            'interests': "Tommy's main interests include:\n• AI and Machine Learning 🤖\n• Quantitative Finance 📊\n• Web Development 💻\n• Basketball (Go Warriors!) 🏀\n• Creating fun projects and games\n• Music and creative stuff 🎵",
            'projects': "Tommy has built some amazing projects like:\n• yumstock - A trading analysis tool with technical indicators\n• yumetfeagle - ETF momentum scanner\n• This cool retro-styled website you're on right now!\n• Various fun games and interactive experiences\n\nCheck out his Projects page to see more! 🚀",
            'music': "Tommy has a great taste in music! Check out his Favorite Songs page to see what he's been listening to. He's got quite the eclectic playlist! 🎵",
            'skills': "Tommy knows:\n• Python, JavaScript, HTML/CSS\n• AI/ML frameworks\n• Financial analysis and trading algorithms\n• Web design and development\n• Git and version control\n\nHe's always learning new things! 📚",
            'basketball': "Tommy is a huge basketball fan, especially of Steph Curry and the Golden State Warriors! 🏀 He even has a page dedicated to Steph on this site. Check it out!",
            'steph curry': "Yes! Tommy is a massive Steph Curry fan! He even created a special page about Steph on this website. The guy's got great taste - Curry is amazing! 🏀⭐",
            'contact': "The best way to connect with Tommy is through this website! You can explore his projects, check out his gallery, or see his other social links on the About Me page.",
            'school': "Tommy is currently in high school and has done some cool school projects. Check out his School Projects page to see what he's been working on! 📚",
            'games': "Tommy has created and shared some fun games on this site! Check out the Extras section or the Silly Things page - there might be some hidden gems there! 🎮",
            'default': [
                "That's an interesting question! Feel free to explore Tommy's website to learn more about him. Try checking out his Gallery, Projects, or About Me pages! 😊",
                "I'm still learning! But I can tell you Tommy is passionate about tech, coding, and basketball. What else would you like to know? 🤔",
                "Good question! Tommy has built some cool stuff - check out his yumstock and yumetfeagle projects. They're about financial analysis and trading! 📊",
                "I'd love to chat more about that! In the meantime, explore the different sections of Tommy's website - there's lots of cool stuff to discover! ✨"
            ]
        };
        
        // Handle Enter key
        chatInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
        
        function sendSuggestion(text) {
            chatInput.value = text;
            sendMessage();
        }
        
        function sendMessage() {
            const message = chatInput.value.trim();
            if (!message) return;
            
            // Add user message to chat
            addMessage(message, 'user');
            chatInput.value = '';
            
            // Disable input while processing
            sendButton.disabled = true;
            chatInput.disabled = true;
            
            // Show typing indicator
            const typingDiv = addTypingIndicator();
            
            // Simulate thinking time
            setTimeout(() => {
                typingDiv.remove();
                
                // Get response
                const response = getResponse(message);
                addMessage(response, 'bot');
                
                // Re-enable input
                sendButton.disabled = false;
                chatInput.disabled = false;
                chatInput.focus();
            }, 1000 + Math.random() * 1000); // Random delay 1-2 seconds
        }
        
        function getResponse(message) {
            const lowerMessage = message.toLowerCase();
            
            // Check for keyword matches
            for (const [keyword, response] of Object.entries(responses)) {
                if (keyword === 'default') continue;
                if (lowerMessage.includes(keyword)) {
                    return response;
                }
            }
            
            // Return random default response
            const defaults = responses.default;
            return defaults[Math.floor(Math.random() * defaults.length)];
        }
        
        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = sender === 'bot' ? '🤖' : '👤';
            
            const content = document.createElement('div');
            content.className = 'message-content';
            content.innerHTML = text.replace(/\n/g, '<br>');
            
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(content);
            chatMessages.appendChild(messageDiv);
            
            // Scroll to bottom
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        function addTypingIndicator() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message bot';
            typingDiv.innerHTML = `
                <div class="message-avatar">🤖</div>
                <div class="message-content">
                    <div class="typing-indicator">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            `;
            chatMessages.appendChild(typingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return typingDiv;
        }
    </script>
</body>
</html>
