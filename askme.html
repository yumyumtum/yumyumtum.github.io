<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask Me - PhantomGamez</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .chat-container {
            max-width: 800px;
            margin: 40px auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .chat-header h1 {
            margin: 0;
            font-size: 24px;
        }
        
        .chat-header p {
            margin: 5px 0 0;
            opacity: 0.9;
            font-size: 14px;
        }
        
        .chat-messages {
            height: 500px;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }
        
        .message {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
            animation: fadeIn 0.3s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.user {
            flex-direction: row-reverse;
        }
        
        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
        }
        
        .message.bot .message-content {
            background: white;
            color: #333;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        
        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin: 0 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }
        
        .message.bot .message-avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .message.user .message-avatar {
            background: #e9ecef;
        }
        
        .chat-input-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #e9ecef;
            display: flex;
            gap: 10px;
        }
        
        #chatInput {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            border-radius: 25px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }
        
        #chatInput:focus {
            border-color: #667eea;
        }
        
        #sendButton {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        #sendButton:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        #sendButton:active {
            transform: translateY(0);
        }
        
        #sendButton:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 10px;
        }
        
        .typing-indicator span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #667eea;
            animation: typing 1.4s infinite;
        }
        
        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }
        
        .back-button {
            display: inline-block;
            margin: 20px;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 20px;
            transition: transform 0.2s;
        }
        
        .back-button:hover {
            transform: translateY(-2px);
        }
        
        .suggestions {
            display: flex;
            gap: 10px;
            padding: 10px 20px;
            overflow-x: auto;
            background: white;
        }
        
        .suggestion-chip {
            padding: 8px 16px;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .suggestion-chip:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-button">← Back to Home</a>
    
    <div class="chat-container">
        <div class="chat-header">
            <h1>🤖 Ask Me Anything</h1>
            <p>I can chat about Skye or anything else!</p>
        </div>
        
        <div class="suggestions">
            <div class="suggestion-chip" onclick="sendSuggestion('Who is Skye?')">Who is Skye?</div>
            <div class="suggestion-chip" onclick="sendSuggestion('Tell me a joke')">Tell me a joke</div>
            <div class="suggestion-chip" onclick="sendSuggestion('What can you do?')">What can you do?</div>
            <div class="suggestion-chip" onclick="sendSuggestion('How are you?')">How are you?</div>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">
                <div class="message-avatar">👻</div>
                <div class="message-content">
                    Yo! I'm PhantomGamezChatter. I can chat about Skye, tell jokes, answer questions, or just vibe. What's good? 😎
                </div>
            </div>
        </div>
        
        <div class="chat-input-container">
            <input type="text" id="chatInput" placeholder="Type your message..." autocomplete="off">
            <button id="sendButton" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendButton = document.getElementById('sendButton');
        
        let conversationContext = [];
        
        // Comprehensive response patterns
        const patterns = [
            // Greetings
            { regex: /^(hi|hello|hey|yo|sup|what's up|whats up)/i, 
              responses: ["Hey! What's up? 😊", "Hi there! How can I help?", "Hello! Nice to chat with you!", "Yo! What can I do for you?"] },
            
            // How are you
            { regex: /(how are you|how're you|how r u|hows it going|whats new)/i,
              responses: ["I'm doing great! Just here to chat. How about you?", "Pretty good! Ready to help with whatever you need.", "I'm excellent! Thanks for asking. What about you?"] },
            
            // Jokes
            { regex: /(tell me a joke|joke|make me laugh|something funny)/i,
              responses: [
                  "Why do programmers prefer dark mode? Because light attracts bugs! 🐛😄",
                  "What's a computer's favorite snack? Microchips! 💻🍟",
                  "Why did the developer go broke? Because he used up all his cache! 💸",
                  "How do you comfort a JavaScript bug? You console it! 🤓"
              ]},
            
            // Skye-related
            { regex: /(who is skye|about skye|skye yan|tell me about skye)/i,
              responses: ["Skye is the creator of this website! He's a high school student who loves coding, AI, trading analysis, and basketball. Pretty cool guy! 🏀💻"] },
            
            { regex: /(skye'?s? projects|what did skye make|yumstock|yumetfeagle)/i,
              responses: ["Skye built some awesome stuff! His main projects are yumstock and yumetfeagle - trading analysis tools with technical indicators and ETF momentum scanning. Check out his Projects page! 📊"] },
            
            // Capabilities
            { regex: /(what can you do|your capabilities|help me|how do you work)/i,
              responses: ["I can chat about pretty much anything! Ask me about Skye, tell me to tell jokes, have a conversation, answer questions... I'm here to help! 🤖"] },
            
            // Thank you
            { regex: /(thank you|thanks|thx|appreciate)/i,
              responses: ["You're welcome! 😊", "No problem at all!", "Happy to help!", "Anytime! 🙌"] },
            
            // Math
            { regex: /what is (\d+)\s*[\+\-\*\/]\s*(\d+)/i,
              handler: (match) => {
                  try {
                      const result = eval(match[0].replace('what is ', ''));
                      return `That equals ${result}! 🧮`;
                  } catch {
                      return "Hmm, I couldn't calculate that. Try a simpler math problem!";
                  }
              }},
            
            // Time
            { regex: /(what time|current time|time is it)/i,
              handler: () => `It's ${new Date().toLocaleTimeString()}! ⏰` },
            
            // Date
            { regex: /(what date|today'?s? date|what day)/i,
              handler: () => `Today is ${new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}! 📅` },
            
            // Weather
            { regex: /(weather|temperature|forecast)/i,
              responses: ["I can't check the weather right now, but you can try weather.com or your phone's weather app! ⛅"] },
            
            // Music
            { regex: /(music|song|favorite song|what music)/i,
              responses: ["Skye has great taste in music! Check out his Favorite Songs page on this website to see what he's listening to. 🎵"] },
            
            // Basketball
            { regex: /(basketball|nba|steph curry|warriors|hoops)/i,
              responses: ["Skye loves basketball, especially Steph Curry and the Warriors! He even has a page dedicated to Steph on this site. 🏀⭐"] },
            
            // Coding/Programming
            { regex: /(coding|programming|code|developer|software)/i,
              responses: ["Skye knows Python, JavaScript, HTML/CSS, and he's into AI/ML too. He's built some cool trading tools and this awesome website! 💻"] },
            
            // AI/ML
            { regex: /(artificial intelligence|machine learning|ai|ml|neural|deep learning)/i,
              responses: ["Skye is really into AI and machine learning! He's built some cool projects combining AI with financial analysis. Pretty cutting-edge stuff! 🤖🧠"] },
            
            // Games
            { regex: /(game|play|fun|entertainment)/i,
              responses: ["Skye has some games on this site! Check out the Extras section or Silly Things page. There might be some hidden fun stuff! 🎮"] },
            
            // Yes/No
            { regex: /^(yes|yeah|yep|yup|sure|ok|okay)$/i,
              responses: ["Cool! What else can I help with?", "Awesome! Anything else?", "Great! What's next?"] },
            
            { regex: /^(no|nope|nah|not really)$/i,
              responses: ["No worries! Let me know if you need anything else.", "Alright! Feel free to ask anything.", "That's okay! What else is on your mind?"] },
            
            // Goodbye
            { regex: /(bye|goodbye|see you|later|gtg|gotta go)/i,
              responses: ["See you later! 👋", "Goodbye! Come back anytime!", "Catch you later! 😊", "Take care! 👋"] },
            
            // Name
            { regex: /(what'?s? your name|who are you|your name)/i,
              responses: ["I'm PhantomGamezChatter! 👻 The AI assistant for this site. Here to vibe and help out! 🎮"] },
            
            // Age
            { regex: /(how old are you|your age)/i,
              responses: ["I'm just a chatbot, so I don't really have an age! But I was created recently for this website. 🤖"] },
            
            // Favorite color/food/etc
            { regex: /(favorite color|favorite food|favorite)/i,
              responses: ["I'm a chatbot, so I don't have preferences like humans do. But I think purple and blue gradients look pretty cool! 💜💙"] }
        ];
        
        // Handle Enter key
        chatInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
        
        function sendSuggestion(text) {
            chatInput.value = text;
            sendMessage();
        }
        
        function sendMessage() {
            const message = chatInput.value.trim();
            if (!message) return;
            
            // Add user message to chat
            addMessage(message, 'user');
            conversationContext.push({role: 'user', content: message});
            chatInput.value = '';
            
            // Disable input while processing
            sendButton.disabled = true;
            chatInput.disabled = true;
            
            // Show typing indicator
            const typingDiv = addTypingIndicator();
            
            // Simulate thinking time
            setTimeout(() => {
                typingDiv.remove();
                
                // Get response
                const response = getResponse(message);
                addMessage(response, 'bot');
                conversationContext.push({role: 'bot', content: response});
                
                // Re-enable input
                sendButton.disabled = false;
                chatInput.disabled = false;
                chatInput.focus();
            }, 800 + Math.random() * 700);
        }
        
        function getResponse(message) {
            // Check each pattern
            for (const pattern of patterns) {
                const match = message.match(pattern.regex);
                if (match) {
                    if (pattern.handler) {
                        return pattern.handler(match);
                    }
                    if (pattern.responses) {
                        return pattern.responses[Math.floor(Math.random() * pattern.responses.length)];
                    }
                }
            }
            
            // Smart defaults based on context
            const defaults = [
                "That's interesting! Tell me more.",
                "I'm not sure about that specifically, but feel free to explore Skye's website or ask me something else!",
                "Hmm, good question! I'm still learning. What else would you like to know?",
                "I don't have info on that right now, but I'm happy to chat about other topics!",
                "That's beyond my knowledge base at the moment. Want to ask about Skye or chat about something else?",
                "I'm not quite sure how to answer that! Try asking me something about this website or just chat. 😊"
            ];
            
            return defaults[Math.floor(Math.random() * defaults.length)];
        }
        
        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = sender === 'bot' ? '👻' : '👤';
            
            const content = document.createElement('div');
            content.className = 'message-content';
            content.innerHTML = text.replace(/\n/g, '<br>');
            
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(content);
            chatMessages.appendChild(messageDiv);
            
            // Scroll to bottom
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        function addTypingIndicator() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message bot';
            typingDiv.innerHTML = `
                <div class="message-avatar">👻</div>
                <div class="message-content">
                    <div class="typing-indicator">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            `;
            chatMessages.appendChild(typingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return typingDiv;
        }
    </script>
</body>
</html>
