<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Snake - PhantomGamez</title>
<link rel="icon" type="image/x-icon" href="../../favicon.ico">
<style>
  :root { --neon: #0ff; --neon2: #f0f; --bg: #05050a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: radial-gradient(circle at 50% 30%, #12122a 0%, var(--bg) 70%);
    color: var(--neon);
    font-family: "Courier New", monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  h1 {
    font-size: clamp(1.5rem, 6vw, 2.6rem);
    letter-spacing: .15em;
    text-transform: uppercase;
    text-shadow: 0 0 8px var(--neon), 0 0 20px var(--neon);
    margin-bottom: .4rem;
    animation: flicker 3s infinite;
  }
  @keyframes flicker {
    0%,19%,21%,23%,80%,100% { opacity: 1; }
    20%,22% { opacity: .55; }
  }
  .hud {
    display: flex; gap: 1.5rem; margin-bottom: .6rem;
    font-size: 1rem; text-shadow: 0 0 6px var(--neon2); color: var(--neon2);
  }
  canvas {
    background: rgba(0,0,0,.55);
    border: 2px solid var(--neon);
    border-radius: 8px;
    box-shadow: 0 0 18px var(--neon), inset 0 0 22px rgba(0,255,255,.15);
    touch-action: none;
    max-width: 92vw;
    max-height: 62vh;
  }
  .msg {
    margin-top: .8rem;
    min-height: 1.4rem;
    font-size: 1rem;
    color: var(--neon2);
    text-shadow: 0 0 8px var(--neon2);
    text-align: center;
  }
  .hint { margin-top:.3rem; font-size:.75rem; opacity:.6; letter-spacing:.1em;}
  a.back {
    margin-top: 1rem; color: var(--neon); text-decoration: none;
    border: 1px solid var(--neon); padding: .35rem .9rem; border-radius: 6px;
    text-shadow: 0 0 6px var(--neon); box-shadow: 0 0 10px rgba(0,255,255,.3);
    font-size:.85rem;
  }
  a.back:hover { background: rgba(0,255,255,.12); }
</style>
</head>
<body>
  <h1>Neon Snake</h1>
  <div class="hud">
    <span>SCORE <b id="score">0</b></span>
    <span>BEST <b id="best">0</b></span>
  </div>
  <canvas id="game" width="400" height="400"></canvas>
  <div class="msg" id="msg">Press SPACE / tap to start</div>
  <div class="hint">Arrows / WASD · swipe on mobile</div>
  <div class="hint" style="margin-top:.5rem;">
    <span style="color:#f0f;text-shadow:0 0 6px #f0f">■</span> +1 &nbsp;
    <span style="color:#39f;text-shadow:0 0 6px #39f">■</span> 10× score (2) &nbsp;
    <span style="color:#3f6;text-shadow:0 0 6px #3f6">■</span> speed×3 20s
  </div>
  <a class="back" href="../../games.html">← Back to Games</a>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const msgEl = document.getElementById('msg');
  const GRID = 20, CELL = canvas.width / GRID;
  let snake, dir, nextDir, foods, score, best, running, dead, tick, speed, baseSpeed;
  let mult=1, multLeft=0, boostLeft=0; // 10x score for N eats; speed boost timer (ticks)
  const FOOD_COUNT=4;
  // block types: pink=normal, blue=10x score(2 eats), green=speed boost(20s)
  const TYPES=['pink','pink','pink','blue','green'];
  const COLORS={pink:'#f0f',blue:'#39f',green:'#3f6'};

  best = parseInt(localStorage.getItem('neonSnakeBest')||'0',10);
  bestEl.textContent = best;

  function reset(){
    snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
    dir = {x:1,y:0}; nextDir = {x:1,y:0};
    score = 0; baseSpeed = 130; speed = baseSpeed; dead=false; running=false;
    mult=1; multLeft=0; boostLeft=0;
    foods=[];
    scoreEl.textContent = 0;
    placeFood();
    draw();
    msgEl.textContent = 'Press SPACE / tap to start';
  }
  function occupied(x,y){
    return snake.some(s=>s.x===x&&s.y===y) || (foods&&foods.some(f=>f.x===x&&f.y===y));
  }
  function makeFood(){
    let x,y;
    do { x=(Math.random()*GRID)|0; y=(Math.random()*GRID)|0; } while(occupied(x,y));
    const type = TYPES[(Math.random()*TYPES.length)|0];
    return {x,y,type};
  }
  function placeFood(){
    foods=[];
    for(let i=0;i<FOOD_COUNT;i++) foods.push(makeFood());
  }
  function start(){
    if(running) return;
    if(dead) reset();
    running = true; msgEl.textContent=''; loop();
  }
  function loop(){
    if(!running) return;
    step();
    tick = setTimeout(loop, speed);
  }
  function step(){
    dir = nextDir;
    const head = {x: snake[0].x+dir.x, y: snake[0].y+dir.y};
    if(head.x<0||head.y<0||head.x>=GRID||head.y>=GRID||snake.some(s=>s.x===head.x&&s.y===head.y)){
      return gameOver();
    }
    snake.unshift(head);
    const fi = foods.findIndex(f=>f.x===head.x&&f.y===head.y);
    if(fi>=0){
      const eaten = foods[fi];
      if(eaten.type==='blue'){ mult=10; multLeft=2; }
      else if(eaten.type==='green'){ boostLeft += 20*10; } // 20s @ ~10 ticks/s
      const gain = mult;
      score += gain; scoreEl.textContent=score;
      if(multLeft>0){ multLeft--; if(multLeft<=0) mult=1; }
      if(baseSpeed>60) baseSpeed-=3;
      foods.splice(fi,1); foods.push(makeFood());
    } else { snake.pop(); }
    // apply speed boost
    if(boostLeft>0){ boostLeft--; speed=Math.max(30, Math.round(baseSpeed/3)); }
    else { speed=baseSpeed; }
    updateStatus();
    draw();
  }
  function updateStatus(){
    let parts=[];
    if(mult>1) parts.push('10x SCORE x'+multLeft);
    if(boostLeft>0) parts.push('SPEED x3 '+Math.ceil(boostLeft/10)+'s');
    msgEl.textContent = parts.join('  ·  ');
  }
  function gameOver(){
    running=false; dead=true; clearTimeout(tick);
    if(score>best){ best=score; localStorage.setItem('neonSnakeBest',best); bestEl.textContent=best; }
    msgEl.textContent = 'GAME OVER — SPACE / tap to retry';
    ctx.fillStyle='rgba(255,0,255,.12)';
    ctx.fillRect(0,0,canvas.width,canvas.height);
  }
  function cell(x,y,color,glow){
    ctx.fillStyle=color; ctx.shadowColor=glow||color; ctx.shadowBlur=12;
    ctx.fillRect(x*CELL+1.5,y*CELL+1.5,CELL-3,CELL-3);
    ctx.shadowBlur=0;
  }
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    // grid glow
    ctx.strokeStyle='rgba(0,255,255,.06)';
    for(let i=1;i<GRID;i++){
      ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,canvas.height);ctx.stroke();
      ctx.beginPath();ctx.moveTo(0,i*CELL);ctx.lineTo(canvas.width,i*CELL);ctx.stroke();
    }
    foods.forEach(f=>{ const c=COLORS[f.type]; cell(f.x,f.y,c,c); });
    snake.forEach((s,i)=>{
      const c = i===0 ? '#fff' : '#0ff';
      cell(s.x,s.y,c,'#0ff');
    });
  }
  function turn(x,y){
    if(dir.x===-x&&dir.y===-y) return; // no reverse
    nextDir={x,y};
  }
  document.addEventListener('keydown',e=>{
    const k=e.key.toLowerCase();
    if(k===' '||k==='enter'){ e.preventDefault(); start(); return; }
    if(k==='arrowup'||k==='w') turn(0,-1);
    else if(k==='arrowdown'||k==='s') turn(0,1);
    else if(k==='arrowleft'||k==='a') turn(-1,0);
    else if(k==='arrowright'||k==='d') turn(1,0);
  });
  // touch / swipe
  let tsx=0,tsy=0;
  canvas.addEventListener('touchstart',e=>{const t=e.touches[0];tsx=t.clientX;tsy=t.clientY;if(!running)start();},{passive:true});
  canvas.addEventListener('touchmove',e=>{
    const t=e.touches[0];const dx=t.clientX-tsx,dy=t.clientY-tsy;
    if(Math.abs(dx)<18&&Math.abs(dy)<18)return;
    if(Math.abs(dx)>Math.abs(dy)) turn(dx>0?1:-1,0); else turn(0,dy>0?1:-1);
    tsx=t.clientX;tsy=t.clientY;
  },{passive:true});
  canvas.addEventListener('click',()=>{ if(!running) start(); });

  reset();
})();
</script>
</body>
</html>
