<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Snake - PhantomGamez</title>
<link rel="icon" type="image/x-icon" href="../../favicon.ico">
<style>
  :root { --neon: #0ff; --neon2: #f0f; --bg: #05050a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: radial-gradient(circle at 50% 30%, #12122a 0%, var(--bg) 70%);
    color: var(--neon);
    font-family: "Courier New", monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  h1 {
    font-size: clamp(1.5rem, 6vw, 2.6rem);
    letter-spacing: .15em;
    text-transform: uppercase;
    text-shadow: 0 0 8px var(--neon), 0 0 20px var(--neon);
    margin-bottom: .4rem;
    animation: flicker 3s infinite;
  }
  @keyframes flicker {
    0%,19%,21%,23%,80%,100% { opacity: 1; }
    20%,22% { opacity: .55; }
  }
  .hud {
    display: flex; gap: 1.5rem; margin-bottom: .6rem;
    font-size: 1rem; text-shadow: 0 0 6px var(--neon2); color: var(--neon2);
  }
  canvas {
    background: rgba(0,0,0,.55);
    border: 2px solid var(--neon);
    border-radius: 8px;
    box-shadow: 0 0 18px var(--neon), inset 0 0 22px rgba(0,255,255,.15);
    touch-action: none;
    max-width: 92vw;
    max-height: 62vh;
  }
  .msg {
    margin-top: .8rem;
    min-height: 1.4rem;
    font-size: 1rem;
    color: var(--neon2);
    text-shadow: 0 0 8px var(--neon2);
    text-align: center;
  }
  .hint { margin-top:.3rem; font-size:.75rem; opacity:.6; letter-spacing:.1em;}
  a.back {
    margin-top: 1rem; color: var(--neon); text-decoration: none;
    border: 1px solid var(--neon); padding: .35rem .9rem; border-radius: 6px;
    text-shadow: 0 0 6px var(--neon); box-shadow: 0 0 10px rgba(0,255,255,.3);
    font-size:.85rem;
  }
  a.back:hover { background: rgba(0,255,255,.12); }
</style>
</head>
<body>
  <h1>Neon Snake</h1>
  <div class="hud">
    <span>SCORE <b id="score">0</b></span>
    <span>BEST <b id="best">0</b></span>
  </div>
  <canvas id="game" width="400" height="400"></canvas>
  <div class="msg" id="msg">Press SPACE / tap to start</div>
  <div class="hint">Arrows / WASD · swipe on mobile</div>
  <a class="back" href="../../games.html">← Back to Games</a>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const msgEl = document.getElementById('msg');
  const GRID = 20, CELL = canvas.width / GRID;
  let snake, dir, nextDir, food, score, best, running, dead, tick, speed;

  best = parseInt(localStorage.getItem('neonSnakeBest')||'0',10);
  bestEl.textContent = best;

  function reset(){
    snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
    dir = {x:1,y:0}; nextDir = {x:1,y:0};
    score = 0; speed = 130; dead=false; running=false;
    scoreEl.textContent = 0;
    placeFood();
    draw();
    msgEl.textContent = 'Press SPACE / tap to start';
  }
  function placeFood(){
    do { food = {x: (Math.random()*GRID)|0, y:(Math.random()*GRID)|0}; }
    while(snake.some(s=>s.x===food.x&&s.y===food.y));
  }
  function start(){
    if(running) return;
    if(dead) reset();
    running = true; msgEl.textContent=''; loop();
  }
  function loop(){
    if(!running) return;
    step();
    tick = setTimeout(loop, speed);
  }
  function step(){
    dir = nextDir;
    const head = {x: snake[0].x+dir.x, y: snake[0].y+dir.y};
    if(head.x<0||head.y<0||head.x>=GRID||head.y>=GRID||snake.some(s=>s.x===head.x&&s.y===head.y)){
      return gameOver();
    }
    snake.unshift(head);
    if(head.x===food.x&&head.y===food.y){
      score++; scoreEl.textContent=score;
      if(speed>60) speed-=3;
      placeFood();
    } else { snake.pop(); }
    draw();
  }
  function gameOver(){
    running=false; dead=true; clearTimeout(tick);
    if(score>best){ best=score; localStorage.setItem('neonSnakeBest',best); bestEl.textContent=best; }
    msgEl.textContent = 'GAME OVER — SPACE / tap to retry';
    ctx.fillStyle='rgba(255,0,255,.12)';
    ctx.fillRect(0,0,canvas.width,canvas.height);
  }
  function cell(x,y,color,glow){
    ctx.fillStyle=color; ctx.shadowColor=glow||color; ctx.shadowBlur=12;
    ctx.fillRect(x*CELL+1.5,y*CELL+1.5,CELL-3,CELL-3);
    ctx.shadowBlur=0;
  }
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    // grid glow
    ctx.strokeStyle='rgba(0,255,255,.06)';
    for(let i=1;i<GRID;i++){
      ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,canvas.height);ctx.stroke();
      ctx.beginPath();ctx.moveTo(0,i*CELL);ctx.lineTo(canvas.width,i*CELL);ctx.stroke();
    }
    cell(food.x,food.y,'#f0f','#f0f');
    snake.forEach((s,i)=>{
      const c = i===0 ? '#fff' : '#0ff';
      cell(s.x,s.y,c,'#0ff');
    });
  }
  function turn(x,y){
    if(dir.x===-x&&dir.y===-y) return; // no reverse
    nextDir={x,y};
  }
  document.addEventListener('keydown',e=>{
    const k=e.key.toLowerCase();
    if(k===' '||k==='enter'){ e.preventDefault(); start(); return; }
    if(k==='arrowup'||k==='w') turn(0,-1);
    else if(k==='arrowdown'||k==='s') turn(0,1);
    else if(k==='arrowleft'||k==='a') turn(-1,0);
    else if(k==='arrowright'||k==='d') turn(1,0);
  });
  // touch / swipe
  let tsx=0,tsy=0;
  canvas.addEventListener('touchstart',e=>{const t=e.touches[0];tsx=t.clientX;tsy=t.clientY;if(!running)start();},{passive:true});
  canvas.addEventListener('touchmove',e=>{
    const t=e.touches[0];const dx=t.clientX-tsx,dy=t.clientY-tsy;
    if(Math.abs(dx)<18&&Math.abs(dy)<18)return;
    if(Math.abs(dx)>Math.abs(dy)) turn(dx>0?1:-1,0); else turn(0,dy>0?1:-1);
    tsx=t.clientX;tsy=t.clientY;
  },{passive:true});
  canvas.addEventListener('click',()=>{ if(!running) start(); });

  reset();
})();
</script>
</body>
</html>
